name: probe
on: { workflow_dispatch: { inputs: { url: { description: "url", default: "https://www.fpsc.gov.pk/uploads/content/1793976822925_consolidated-advertisement-04-2026.pdf" } } } }
jobs:
  run:
    runs-on: ubuntu-latest
    env: { NODE_EXTRA_CA_CERTS: "${{ github.workspace }}/certs/gogetssl-rsa-dv-ssl-ca-2.pem" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/snapshot.ts "${{ github.event.inputs.url }}" | grep -v B64 | head -3
      - run: |
          sudo apt-get install -y tesseract-ocr poppler-utils >/dev/null 2>&1
          pdfinfo snap.html | grep -E "Pages|Page size"
          pdftoppm -r 170 -f 1 -l 3 -gray -png snap.html pg
          for f in pg-*.png; do tesseract $f ${f%.png} --psm 6 >/dev/null 2>&1; done
          for f in pg-*.txt; do echo "=====$f====="; sed -n 1,80p $f; done
          echo "=====DATES====="; cat pg-*.txt | grep -nEi "last date|closing|on or before|deadline|up ?to|november|december|2026" | head -25
