name: probe-papers
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look at Express and Aaj e-paper structure
        run: |
          UA="Mozilla/5.0 (compatible; RozgarDeskBot/1.0; +https://rozgardesk.vercel.app)"
          echo "=== EXPRESS index"
          curl -s -A "$UA" -m 25 "https://www.express.com.pk/epaper/Index.aspx" -o /tmp/e.html
          grep -oE "(href|src|value|onclick)=\"[^\"]*(epaper|NP_|\.jpg|Page)[^\"]*\"" /tmp/e.html | sort -u | head -60
          echo "=== AAJ home"
          curl -s -A "$UA" -m 25 -c /tmp/cj "https://epaper.dailyaaj.com.pk/" -o /tmp/a.html
          grep -oE "<(form|input|select|option)[^>]*>" /tmp/a.html | head -60
          grep -oE "(href|src)=\"[^\"]*(epaper|main)[^\"]*\"" /tmp/a.html | sort -u | head -30
