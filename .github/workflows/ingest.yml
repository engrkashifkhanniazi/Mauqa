name: ingest-official
on: { schedule: [{ cron: "7 */3 * * *" }], workflow_dispatch: { inputs: { dry: { description: "dry run (no DB writes)", default: "false" } } } }
concurrency: ingest
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { issues: write, contents: read }
    env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}", ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", CLAUDE_MONTHLY_BUDGET_USD: "${{ secrets.CLAUDE_MONTHLY_BUDGET_USD }}", GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run worker -- ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
      - name: Health check
        run: |
          npx tsx workers/health.ts 2> health.txt || { gh issue create --title "Rozgar Desk source health alert" --body "$(cat health.txt)" || true; }
