name: migrate
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
