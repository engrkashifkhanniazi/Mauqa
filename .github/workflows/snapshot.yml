name: snapshot
on: { workflow_dispatch: { inputs: { url: { description: "url", default: "https://www.fpsc.gov.pk/category/advertisements" } } } }
jobs:
  run:
    runs-on: ubuntu-latest
    env: { NODE_EXTRA_CA_CERTS: "${{ github.workspace }}/certs/gogetssl-rsa-dv-ssl-ca-2.pem" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/snapshot.ts "${{ github.event.inputs.url }}"
