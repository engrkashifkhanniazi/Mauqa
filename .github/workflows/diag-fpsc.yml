name: diag-fpsc
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSf -o ca.crt http://crt.sectigo.com/GoGetSSLRSADVSSLCA2.crt
          openssl x509 -inform DER -in ca.crt -out ca.pem 2>/dev/null || cp ca.crt ca.pem
          openssl x509 -in ca.pem -noout -subject -issuer -dates -fingerprint -sha256
          echo "---PEM---"; cat ca.pem; echo "---END---"
          echo | openssl s_client -connect www.fpsc.gov.pk:443 -servername www.fpsc.gov.pk -CAfile ca.pem 2>/dev/null | grep -E "Verif"
