name: live-test
on: { workflow_dispatch: { inputs: { base: { description: "base url", default: "https://mauqa.vercel.app" } } } }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: { BASE_URL: "${{ github.event.inputs.base }}", PW_SYSTEM_CHROME: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Playwright (live, 390x844 and 1440)
        run: npx playwright test -c playwright.live.config.ts
      - name: Lighthouse mobile
        if: always()
        run: |
          for p in "/" ; do npx --yes lighthouse "$BASE_URL$p" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,seo,best-practices --output=json --output-path=lh.json >/dev/null 2>&1 || true
            node -e 'const r=require("./lh.json");const c=r.categories;console.log("LIGHTHOUSE mobile",process.argv[1],JSON.stringify(Object.fromEntries(Object.entries(c).map(([k,v])=>[k,Math.round(v.score*100)]))));const a=Object.values(r.audits).filter(x=>x.score!==null&&x.score<0.9&&x.scoreDisplayMode==="binary").map(x=>x.id);console.log("FAILED_AUDITS",a.join(","));const d=(x)=>Object.values(r.audits).filter(a=>a.id==="color-contrast"||a.id==="meta-description").forEach(a=>console.log("DETAIL",a.id,JSON.stringify((a.details&&a.details.items||[]).slice(0,6).map(i=>i.node&&i.node.snippet||i)).slice(0,900)));d();' "$p"
          done
      - name: Lighthouse mobile (job page)
        if: always()
        run: |
          slug=$(curl -s "$BASE_URL/api/jobs?limit=1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).jobs[0].slug))')
          curl -s "$BASE_URL/jobs/$slug" | grep -o "<meta[^>]*description[^>]*>" | head -3 | sed "s/^/HEADMETA /"
          npx --yes lighthouse "$BASE_URL/jobs/$slug" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility,seo,best-practices --output=json --output-path=lh2.json >/dev/null 2>&1 || true
          node -e 'const r=require("./lh2.json");console.log("LIGHTHOUSE mobile job page",JSON.stringify(Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)]))));console.log("FAILED_AUDITS",Object.values(r.audits).filter(x=>x.score!==null&&x.score<0.9&&x.scoreDisplayMode==="binary").map(x=>x.id).join(","))'
